<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculatorBody">
        <div id="displayScreen"></div>
        <div id="buttonboard">
            <div id="numpad">
                <div id="7" class="numpadButton">7</div>
                <div id="8" class="numpadButton">8</div>
                <div id="9" class="numpadButton">9</div>
                <div id="4" class="numpadButton">4</div>
                <div id="5" class="numpadButton">5</div>
                <div id="6" class="numpadButton">6</div>
                <div id="1" class="numpadButton">1</div>
                <div id="2" class="numpadButton">2</div>
                <div id="3" class="numpadButton">3</div>
                <div id="0" class="numpadButton">0</div>
                <div id="decimalPoint" class="numpadButton">.</div>
                <div id="execute" class="numpadButton">=</div>
            </div>
            <div id="operators">
                <div id="divide" class="operatorButton">÷</div>
                <div id="multiply" class="operatorButton">x</div>
                <div id="subtract" class="operatorButton">-</div>
                <div id="add" class="operatorButton">+</div>
            </div>
        </div>
    </div>
    
    
</body>
</html>
