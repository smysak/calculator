<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculatorBody">
        <div id="displayScreen"></div>
        <div id="buttonboard">
            <div id="headButtonboard">
                <div id="functions">
                    <div id="bang" class=functionButton><button>!</button></div>
                    <div id="exponent" class="functionButton"><button>n<sup>i</sup></button></div>
                    <div id="root" class="functionButton"><button>√</button></div>
                    <div id="percent" class="functionButton"><button>%</button></div>
                </div>
                <div id="clear">
                    <div id="clearAll" class="clearButton"><button>C</button></div>
                </div>
            </div>
            <div id="mainButtonboard">
                <div id="numpad">
                    <div id="7" class="numpadButton"><button>7</button></div>
                    <div id="8" class="numpadButton"><button>8</button></div>
                    <div id="9" class="numpadButton"><button>9</button></div>
                    <div id="4" class="numpadButton"><button>4</button></div>
                    <div id="5" class="numpadButton"><button>5</button></div>
                    <div id="6" class="numpadButton"><button>6</button></div>
                    <div id="1" class="numpadButton"><button>1</button></div>
                    <div id="2" class="numpadButton"><button>2</button></div>
                    <div id="3" class="numpadButton"><button>3</button></div>
                    <div id="0" class="numpadButton"><button>0</button></div>
                    <div id="decimalPoint" class="numpadButton"><button>.</button></div>
                    <div id="execute" class="numpadButton"><button>=</button></div>
                </div>
                <div id="operators">
                    <div id="divide" class="operatorButton"><button>÷</button></div>
                    <div id="multiply" class="operatorButton"><button>x</button></div>
                    <div id="subtract" class="operatorButton"><button>-</button></div>
                    <div id="add" class="operatorButton"><button>+</button></div>
                </div>
            </div>
        </div>
    </div>
    
    
</body>
</html>
